<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UR MASUD PANEL</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}
.panel{
    width:90%;
    max-width:400px;
    padding:30px;
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    text-align:center;
}
h2{margin-bottom:8px}
.subtitle{
    color:#888;
    margin-bottom:25px;
}
.login-buttons{
    display:grid;
    gap:12px;
    margin-bottom:25px;
}
.login-buttons button{
    width:100%;
    padding:13px;
    border:1px solid #444;
    border-radius:8px;
    background:#1b1b1b;
    color:white;
    font-size:15px;
}
input{
    width:100%;
    padding:13px;
    border:1px solid #444;
    border-radius:8px;
    background:#080808;
    color:white;
    outline:none;
    margin-bottom:12px;
}
.access-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:white;
    color:black;
    font-weight:bold;
}
#message{
    margin-top:15px;
    font-weight:bold;
}
.success{color:#4ade80}
.error{color:#f87171}
.footer{
    margin-top:25px;
    color:#555;
    font-size:12px;
}
</style>
</head>

<body>

<div class="panel">

<h2>UR MASUD PANEL</h2>
<div class="subtitle">Login to access the panel</div>

<div class="login-buttons">
<button type="button">FACEBOOK / LOGIN</button>
<button type="button">GMAIL / LOGIN</button>
<button type="button">iOS / LOGIN</button>
</div>

<input
    type="text"
    id="code"
    placeholder="API Key"
    inputmode="numeric"
    maxlength="9"
    autocomplete="off"
>

<button class="access-btn" onclick="login()">ACCESS</button>

<div id="message"></div>

<div class="footer">Protected Access</div>

</div>

<script>
async function login() {
    const code = document.getElementById("code").value.trim();
    const message = document.getElementById("message");

    if (!/^\d{9}$/.test(code)) {
        message.className = "error";
        message.innerText = "✕ Enter a valid 9-digit API Key";
        return;
    }

    message.className = "";
    message.innerText = "Checking...";

    try {
        const response = await fetch(
            "http://127.0.0.1:5000/verify",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    api_key: code
                })
            }
        );

        const result = await response.json();

        if (response.ok && result.success) {
            message.className = "success";
            message.innerText = "✓ Access granted!";
        } else {
            message.className = "error";
            message.innerText = "✕ Invalid API Key";
        }

    } catch (error) {
        message.className = "error";
        message.innerText = "✕ Server connection failed";
    }
}
</script>

</body>
</html>
